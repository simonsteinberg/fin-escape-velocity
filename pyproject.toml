[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "finescape"
version = "0.0.0"
description = "Barista example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
finescape-greet = "finescape.greet:main"

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["finescape"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.coverage.html]
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/finescape"]
