[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "finev"
version = "0.0.0"
description = "Fin-Escape-Velocity example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "nicegui>=3.12.1",
]

[project.scripts]
finev-version = "finev.greet:main"
finev-app = "finev.app:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["finev"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 40

[tool.coverage.html]
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/finev"]
