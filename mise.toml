[tools]
python = "3.12"
uv = "latest"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.format]
description = "Run code formatter"
run = "uv run ruff format ."

[tasks.coverage]
description = "Run tests with coverage report"
run = "uv run pytest --cov=finev --cov-report=term-missing"

[tasks.coverage-ci]
description = "Run tests for CI with JUnit XML and HTML coverage artifacts"
run = "mkdir -p reports && uv run pytest --junitxml=reports/junit.xml --cov=finev --cov-report=term-missing --cov-report=html:reports/htmlcov --cov-report=xml:reports/coverage.xml"

[tasks.lint]
description = "Run lint checks"
run = "uv run ruff check ."

[tasks.format-check]
description = "Check formatting without modifying files"
run = "uv run ruff format --check ."

[tasks.typecheck]
description = "Run static type checks"
run = "uv run mypy"

[tasks.check]
description = "Run all static checks: format-check, lint, typecheck, tests"
run = [
  "mise run format-check",
  "mise run lint",
  "mise run typecheck",
  "mise run test",
]

[tasks.test-e2e]
description = "Run end-to-end tests that launch the CLI/app entry points"
run = "uv run pytest -m e2e"

[tasks.run]
description = "Run wealth forecast and print yearly totals"
run = "uv run python -m finev.cli"

[tasks.app]
description = "Launch the wealth forecast application"
run = "uv run python -m finev.app"

[tasks.sync]
description = "Install project dependencies"
run = "uv sync"

[tasks.install-browsers]
description = "Download the Playwright Chromium browser used by browser-based tests/verification"
# The pip package ships no browser binary; this fetches Chromium into the
# Playwright cache. On a host with sudo (e.g. CI), append `--with-deps` to also
# install the system libraries; locally those must already be present.
run = "uv run playwright install chromium"

[tasks.version]
description = "Print the current project version"
run = "uv version --short"

[tasks.changelog-check]
description = "Fail if CHANGELOG.md has no entries under [Unreleased]"
run = ".tasks/changelog-check.sh"

[tasks.release]
description = "Cut a release: bump version, roll changelog, commit, tag, push. Usage: mise run release -- {patch|minor|major}"
run = ".tasks/release.sh"

[tasks.setup-repo]
description = "Rename project from 'finev' to a specified name"
run = ".tasks/setup-repo.sh"

[tasks.branch-clean-up]
description = "Delete all local and remote branches except main, develop, and the current branch"
run = ".tasks/branch-clean-up.sh"

[tasks.kill]
description = "Kill all running fin-escape-velocity app instances (ports 8081–8130)"
run = "pids=$(for port in $(seq 8081 8130); do lsof -ti tcp:$port 2>/dev/null; done | sort -u); if [ -n \"$pids\" ]; then echo \"Killing PIDs: $pids\"; echo $pids | xargs kill; else echo 'No running instances found.'; fi"
